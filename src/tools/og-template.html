<!doctype html>
<!-- Social share image template. Rendered to images/og-image(-ar).jpg by src/tools/render-og.mjs -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #07080a; }
  .og { position: relative; width: 1200px; height: 630px; color: #f4f0e7; isolation: isolate; }
  .og img.bg { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: 75% center; }
  [dir="rtl"] .og img.bg { transform: scaleX(-1); }
  .og::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(7,8,10,.96) 0%, rgba(7,8,10,.82) 45%, rgba(7,8,10,.3) 100%); }
  [dir="rtl"] .og::before { background: linear-gradient(270deg, rgba(7,8,10,.96) 0%, rgba(7,8,10,.82) 45%, rgba(7,8,10,.3) 100%); }
  .inner { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { height: 86px; width: auto; }
  .brand strong { display: block; font-size: 44px; line-height: 1.1; }
  .brand span { display: block; color: #d8c394; font-size: 26px; }
  h1 { font-size: 66px; line-height: 1.08; letter-spacing: -.03em; max-width: 760px; margin: 0; }
  h1 em { display: block; font-style: normal; background: linear-gradient(100deg, #f3e6c4, #d8c394 40%, #b8955a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  html[lang="ar"] h1 { letter-spacing: 0; line-height: 1.35; font-size: 62px; }
  .pill { align-self: flex-start; padding: 14px 28px; border-radius: 999px; background: linear-gradient(135deg, #ecdcb4, #c9a96e); color: #17130b; font-size: 24px; font-weight: 700; }
</style>
</head>
<body>
<div class="og">
  <img class="bg" src="../../images/opt/hero2-1536.webp" alt="">
  <div class="inner">
    <div class="brand"><img src="../../images/logo.webp" alt=""><div><strong data-name></strong><span data-alt></span></div></div>
    <h1 data-title></h1>
    <span class="pill" data-pill></span>
  </div>
</div>
</body>
</html>
